# Pandit Bano -> GitHub Pages (brief s7 CI, design.md s2 Hosting/CI; FEAT-110). Pages is configured with build_type
# "workflow" (enabled before the first push), so every push to main deploys; workflow_dispatch for a manual rebuild; no
# schedule (the site computes no dates). Pattern: Sudish007/shubhvela (checkout@v7, setup-node@v7, configure-pages@v6,
# upload-pages-artifact@v5, deploy-pages@v5). `npm test` runs unit tests -> build (which runs the content gate; a gate FAIL
# exits 3) -> integration tests over dist/; CI=true makes every budget violation fatal (exit 4). Nothing ships from a red tree.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: test, gate, build dist/
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CI: "true"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: deploy to github-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
